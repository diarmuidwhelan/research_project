<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f8f9fa"/>
    
    <!-- Title -->
    <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">
        GAA Computer Vision System Architecture
    </text>

    <!-- Input Section -->
    <rect x="50" y="100" width="180" height="80" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="140" y="145" text-anchor="middle" font-size="16" font-weight="bold">Broadcast Footage</text>
    <text x="140" y="165" text-anchor="middle" font-size="12">Input Video Stream</text>

    <!-- Core Processing Modules -->
    <g transform="translate(300, 100)">
        <!-- Module Box Container -->
        <rect x="0" y="0" width="600" height="400" rx="10" fill="#fff" stroke="#1976d2" stroke-width="2"/>
        <text x="300" y="-10" text-anchor="middle" font-size="16" font-weight="bold">Processing Modules</text>
        
        <!-- Object Detection Module -->
        <rect x="20" y="20" width="160" height="100" rx="5" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
        <text x="100" y="45" text-anchor="middle" font-size="14" font-weight="bold">Object Detection</text>
        <text x="100" y="65" text-anchor="middle" font-size="12">Player Detection</text>
        <text x="100" y="85" text-anchor="middle" font-size="12">Ball Tracking</text>
        <text x="100" y="105" text-anchor="middle" font-size="12">Multi-Object Tracking</text>

        <!-- Player Classification -->
        <rect x="220" y="20" width="160" height="100" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
        <text x="300" y="45" text-anchor="middle" font-size="14" font-weight="bold">Player Classification</text>
        <text x="300" y="65" text-anchor="middle" font-size="12">Team Assignment</text>
        <text x="300" y="85" text-anchor="middle" font-size="12">Player ID</text>

        <!-- Number Recognition -->
        <rect x="420" y="20" width="160" height="100" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
        <text x="500" y="45" text-anchor="middle" font-size="14" font-weight="bold">Number Recognition</text>
        <text x="500" y="65" text-anchor="middle" font-size="12">Jersey Number Detection</text>
        <text x="500" y="85" text-anchor="middle" font-size="12">Player Identification</text>

        <!-- Pose Estimation -->
        <rect x="20" y="160" width="160" height="100" rx="5" fill="#ffecb3" stroke="#ffa000" stroke-width="1"/>
        <text x="100" y="185" text-anchor="middle" font-size="14" font-weight="bold">Pose Estimation</text>
        <text x="100" y="205" text-anchor="middle" font-size="12">Body Keypoints</text>
        <text x="100" y="225" text-anchor="middle" font-size="12">Pose Tracking</text>

        <!-- Action Recognition -->
        <rect x="220" y="160" width="160" height="100" rx="5" fill="#f8bbd0" stroke="#c2185b" stroke-width="1"/>
        <text x="300" y="185" text-anchor="middle" font-size="14" font-weight="bold">Action Recognition</text>
        <text x="300" y="205" text-anchor="middle" font-size="12">Event Classification</text>
        <text x="300" y="225" text-anchor="middle" font-size="12">Temporal Analysis</text>
        <text x="300" y="245" text-anchor="middle" font-size="12">Action Sequences</text>

        <!-- Field Registration -->
        <rect x="420" y="160" width="160" height="100" rx="5" fill="#b3e5fc" stroke="#0288d1" stroke-width="1"/>
        <text x="500" y="185" text-anchor="middle" font-size="14" font-weight="bold">Field Registration</text>
        <text x="500" y="205" text-anchor="middle" font-size="12">Homography</text>
        <text x="500" y="225" text-anchor="middle" font-size="12">Coordinate Mapping</text>
        <text x="500" y="245" text-anchor="middle" font-size="12">Field Calibration</text>
    </g>

    <!-- Output Data Section -->
    <g transform="translate(300, 550)">
        <rect x="0" y="0" width="600" height="150" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
        <text x="300" y="-10" text-anchor="middle" font-size="16" font-weight="bold">Event Data Output</text>
        
        <!-- Output Attributes -->
        <text x="30" y="30" font-size="14" font-weight="bold">Event Data Attributes:</text>
        <text x="50" y="55" font-size="12">• Event Type (Action Classification)</text>
        <text x="50" y="75" font-size="12">• Player Coordinates (X, Y for each visible player)</text>
        <text x="50" y="95" font-size="12">• Ball Coordinates (X, Y position)</text>
        <text x="50" y="115" font-size="12">• Video Timestamp</text>
        <text x="50" y="135" font-size="12">• Body Parts Involved in Actions</text>
    </g>

    <!-- Data Flow Arrows -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>

    <!-- Input to Processing -->
    <path d="M230,140 L300,140" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Module Interconnections -->
    <g transform="translate(300, 100)">
        <!-- Object Detection to Player Classification -->
        <path d="M180,70 L220,70" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- Player Classification to Number Recognition -->
        <path d="M380,70 L420,70" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- Object Detection to Pose Estimation -->
        <path d="M100,120 L100,160" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- Pose Estimation to Action Recognition -->
        <path d="M180,210 L220,210" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- Field Registration to Output -->
        <path d="M500,260 L500,450" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>

</svg>
