<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <!-- Styles -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Boxes -->
  <rect x="50" y="70" width="100" height="60" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <rect x="200" y="70" width="100" height="60" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <rect x="350" y="70" width="100" height="60" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <rect x="500" y="70" width="100" height="60" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <rect x="650" y="70" width="100" height="60" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  
  <!-- Arrows -->
  <line x1="150" y1="100" x2="200" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="100" x2="350" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="100" x2="500" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="100" x2="650" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Text -->
  <text x="100" y="105" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">Raw Video</text>
  <text x="250" y="105" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">Event Detection</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">Frame</text>
  <text x="400" y="112" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">Processing</text>
  <text x="550" y="105" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">Calibration</text>
  <text x="700" y="98" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">Data</text>
  <text x="700" y="112" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">Export</text>
</svg>
